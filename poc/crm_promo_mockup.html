<html lang="ko">

  · 실명·실연락처·실이메일 0건 (전부 가공 데이터, 연락처 010-0000-0000 형식)

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM 프로모션 추적 목업 · v0.2</title>
<style>
:root{
  --brand:#006d8b; --brand-2:#2e87a0; --brand-strong:#005066;
  --brand-bg20:#f0f6f8; --brand-bg30:#e8f2f5;
  --text:#222222; --text-2:#54575e; --text-3:#7d8187;
  --bg:#ffffff; --page:#eef1f4; --surface-2:#f6f8f9; --surface-3:#eceff1;
  --border:#e0e2e6; --border-strong:#c6c9d0; --divider:#d4d7dc;
  --p0:#c0392b; --p0-bg:#fbe9e7;
  --p1:#b3690a; --p1-bg:#fbefdd;
  --p2:#7d8187; --p2-bg:#f0f1f4;
  --keep:#1f7a4d; --keep-bg:#e3f3ea;
  --tbd:#b3690a; --tbd-bg:#fff6e8; --tbd-border:#e6b877;
  --ask:#6d4bb0; --ask-bg:#efeaf9; --ask-border:#c9b8e8;
  --pink:#d81b60; --pink-bg:#fce4ec;
  --r:8px; --r-lg:12px; --shadow:0 1px 3px rgba(20,30,40,.08),0 1px 2px rgba(20,30,40,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,'Malgun Gothic','맑은 고딕',sans-serif;
  background:var(--page);color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{margin:0;font-weight:600;}
table{border-collapse:collapse;width:100%;}
input,select,textarea{font-family:inherit;}

/* ===== 목업 툴바 ===== */
.mockbar{position:sticky;top:0;z-index:80;background:#1c2430;color:#fff;display:flex;align-items:center;gap:14px;padding:9px 20px;}
.mockbar .mb-title{font-size:14px;font-weight:700;}
.mockbar .mb-title small{font-weight:400;opacity:.75;font-size:11px;margin-left:7px;}
.mockbar .sp{flex:1;}
.scene-tabs{display:flex;background:rgba(255,255,255,.12);border-radius:8px;padding:3px;}
.scene-tabs button{border:none;background:transparent;color:rgba(255,255,255,.78);padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;}
.scene-tabs button.active{background:#fff;color:#1c2430;font-weight:700;}
.mb-btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:5px 12px;border-radius:7px;font-size:12px;}
.mb-btn:hover{background:rgba(255,255,255,.12);}
.mb-btn .cnt{background:var(--tbd);color:#fff;border-radius:9px;font-size:9.5px;padding:0 5px;margin-left:4px;font-weight:700;}

/* ===== 레이아웃 ===== */
.app{display:grid;grid-template-columns:220px 1fr;max-width:1680px;margin:0 auto;min-height:calc(100vh - 41px);background:var(--bg);}
.lnb{background:#fff;border-right:1px solid var(--border);padding:14px 0;}
.lnb .logo{font-size:14px;font-weight:800;color:var(--brand);padding:4px 18px 14px;letter-spacing:-.3px;}
.lnb-item{display:block;width:100%;text-align:left;border:none;background:transparent;padding:9px 18px;font-size:13px;color:var(--text-2);}
.lnb-item:hover{background:var(--surface-2);}
.lnb-item.active{background:var(--brand-bg20);color:var(--brand);font-weight:700;box-shadow:inset 3px 0 0 var(--brand);}
.lnb-sub{display:block;width:100%;text-align:left;border:none;background:transparent;padding:7px 18px 7px 34px;font-size:12.5px;color:var(--text-3);}
.lnb-sub.active{color:var(--brand);font-weight:700;background:var(--brand-bg20);}
.lnb-div{height:1px;background:var(--border);margin:10px 14px;}
.main{padding:18px 26px 70px;min-width:0;position:relative;}
.crumb{font-size:12px;color:var(--text-3);margin-bottom:12px;}
.crumb b{color:var(--text);font-weight:600;}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.page-h h2{font-size:19px;}

/* ===== 배지 ===== */
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;vertical-align:middle;white-space:nowrap;letter-spacing:-.2px;}
.b-p0{background:var(--p0);color:#fff;}
.b-p1{background:#fff;color:var(--p1);border:1px solid var(--p1);}
.b-p2{background:#fff;color:var(--p2);border:1px solid var(--border-strong);}
.b-keep{background:var(--keep-bg);color:var(--keep);border:1px solid #bfe3d0;}
.b-tbd{background:var(--tbd-bg);color:var(--tbd);border:1px dashed var(--tbd-border);}
.b-tbd::before{content:'⚠ ';}
.b-ask{background:var(--ask-bg);color:var(--ask);border:1px dashed var(--ask-border);}
.b-ask::before{content:'? ';}
.b-ro{background:var(--surface-3);color:var(--text-3);border:1px solid var(--border-strong);}

/* ===== 카드/폼 ===== */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:14px;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.card-h h3{font-size:14px;}
.card-b{padding:14px 16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px;}
.fld{min-width:0;}
.fld label{display:block;font-size:11.5px;color:var(--text-2);margin-bottom:5px;font-weight:500;}
.fld label .req{color:var(--p0);}
.ctl{width:100%;border:1px solid var(--border-strong);border-radius:var(--r);padding:7px 10px;font-size:12.5px;background:#fff;color:var(--text);min-height:32px;}
.ctl:focus{outline:none;border-color:var(--brand);}
.ctl[readonly],.ctl:disabled{background:var(--surface-2);color:var(--text-3);}
textarea.ctl{min-height:64px;resize:vertical;}
.fld.keep .ctl{border-color:var(--keep);box-shadow:0 0 0 2px var(--keep-bg);}
.hint{font-size:10.5px;color:var(--text-3);margin-top:4px;}
.sec-div{height:1px;background:var(--border);margin:16px 0;}
.sec-t{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:10px;}

/* 프로모션 블록 (신규 = 붉은 블록) */
.promo-block{border:1.5px solid var(--p0);border-radius:var(--r-lg);background:#fffafa;padding:0;margin:16px 0;}
.promo-h{display:flex;align-items:center;gap:8px;background:var(--p0-bg);padding:9px 14px;border-bottom:1px solid #f0cdc7;border-radius:10px 10px 0 0;flex-wrap:wrap;}
.promo-h .pt{font-size:12.5px;font-weight:700;color:#8a3025;}
.promo-b{padding:13px 14px;}
.promo-sub{font-size:11px;font-weight:700;color:var(--text-2);margin:12px 0 8px;padding-top:10px;border-top:1px dashed var(--border);}
.promo-sub:first-child{margin-top:0;padding-top:0;border-top:none;}

/* 자동 라벨 배지 */
.auto-tag{display:flex;align-items:flex-start;gap:9px;background:var(--brand-bg30);border:1px solid #bfe0e6;border-radius:var(--r-lg);padding:11px 13px;margin-bottom:14px;font-size:12.5px;color:var(--brand-strong);}
.auto-tag .ic{font-size:15px;line-height:1.2;}
.auto-tag b{color:var(--brand);}

/* 표시 전용(장면③) */
.ro-zone{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--r-lg);}
.ro-zone .card-h{background:var(--surface-3);border-radius:11px 11px 0 0;}

/* 탭 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 16px;background:#fff;border-radius:12px 12px 0 0;overflow-x:auto;}
.tab{border:none;background:transparent;padding:11px 13px 9px;font-size:12.5px;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:700;}

/* 버튼 */
.btn{border:1px solid var(--border-strong);background:#fff;color:var(--text-2);padding:7px 13px;border-radius:var(--r);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:5px;}
.btn:hover{border-color:var(--brand);color:var(--brand);}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.btn.primary:hover{background:var(--brand-strong);color:#fff;}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.sm{padding:5px 10px;font-size:11.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* 테이블 */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--r-lg);overflow:auto;}
table.data{font-size:12.5px;}
table.data th{background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:11.5px;text-align:left;padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.data td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.data tr:last-child td{border-bottom:none;}
table.data tbody tr:hover td{background:var(--surface-2);}
.st{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block;}
.st-req{color:var(--brand);background:var(--brand-bg30);}
.st-ok{color:var(--keep);background:var(--keep-bg);}
.st-hold{color:var(--p1);background:var(--p1-bg);}
.st-off{color:var(--text-3);background:var(--p2-bg);}
.st-new{color:var(--pink);background:var(--pink-bg);}
.mono{font-family:'IBM Plex Mono',ui-monospace,'Courier New',monospace;}

/* 드로어 */
.drawer-host{position:relative;}
.drawer{position:fixed;top:41px;right:0;bottom:0;width:560px;background:#fff;border-left:1px solid var(--border);box-shadow:-8px 0 28px rgba(0,0,0,.10);z-index:60;display:flex;flex-direction:column;}
.drawer-h{padding:15px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.drawer-h h3{font-size:15px;}
.drawer-b{padding:16px 18px;overflow-y:auto;flex:1;}
.drawer-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2);}

/* 확인필요 패널 */
.ask-panel{position:fixed;top:41px;right:0;bottom:0;width:460px;background:#fff;border-left:1px solid var(--border);box-shadow:-8px 0 28px rgba(0,0,0,.14);z-index:90;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;}
.ask-panel.show{transform:none;}
.ask-row{border-left:3px solid var(--ask);background:var(--surface-2);border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:8px;font-size:12px;}
.ask-row.tbd{border-left-color:var(--tbd);}
.ask-row .ar-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;}
.ask-row .ar-when{font-size:10.5px;color:var(--text-3);font-weight:700;}
.ask-row .ar-who{font-size:10.5px;color:var(--text-3);}

/* 토스트 */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:#242c36;color:#fff;padding:10px 18px;border-radius:10px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:520px;}
.toast b{color:#7ecfe0;}

/* 범례 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-3);padding:9px 13px;background:#fff;border:1px solid var(--border);border-radius:9px;margin-bottom:14px;align-items:center;}
.note{background:var(--brand-bg20);border:1px solid #cfe4ea;border-radius:var(--r-lg);padding:10px 14px;font-size:12px;color:var(--brand-strong);margin-bottom:14px;}
.note.warn{background:var(--tbd-bg);border-color:var(--tbd-border);color:#8a5a1a;}
.scene{display:none;}
.scene.active{display:block;}
.kv{display:flex;gap:6px;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--border);}
.kv .k{color:var(--text-3);min-width:96px;}
.kv:last-child{border-bottom:none;}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{border:1px solid var(--border);background:#fff;color:var(--text-2);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:500;}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.chip .n{opacity:.75;font-size:10.5px;margin-left:4px;}
.grp-parent td{background:var(--brand-bg20)!important;font-weight:600;}
.grp-child td{color:var(--text-2);}
.grp-child td:first-child{padding-left:30px;position:relative;}
.grp-child td:first-child::before{content:'└';position:absolute;left:14px;color:var(--text-3);}
.menu-dot{border:none;background:transparent;color:var(--text-3);font-size:15px;padding:2px 6px;border-radius:5px;}
.menu-dot:hover{background:var(--surface-3);color:var(--text);}
.summary-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand-bg30);border:1px solid #bfe0e6;border-radius:var(--r-lg);padding:10px 14px;font-size:12.5px;color:var(--brand-strong);margin-bottom:14px;}
</style>
</head>
<body>

<div class="mockbar">
  <div class="mb-title">CRM 프로모션 추적 목업 <small>PRD v0.2 · 2026-08-20 · 9·10월 프로모션</small></div>
  <div class="sp"></div>
  <div class="scene-tabs" id="sceneTabs">
    <button class="active" onclick="setScene(1)">① 인바운드 등록</button>
    <button onclick="setScene(2)">② 계약상세정보</button>
    <button onclick="setScene(3)">③ 사용자 상세</button>
    <button onclick="setScene(4)">④ 추출</button>
  </div>
  <button class="mb-btn" onclick="toggleAsk()">확인 필요<span class="cnt" id="askCnt">0</span></button>
  <button class="mb-btn" onclick="resetAll()">↻ 리셋</button>
</div>

<div class="app">
  <nav class="lnb" id="lnb"></nav>
  <main class="main">
    <div class="crumb" id="crumb"></div>
    <div id="sceneHost"></div>
  </main>
</div>

<div class="ask-panel" id="askPanel">
  <div class="drawer-h"><h3>§11 미확정 · 확인 필요</h3><button class="btn ghost" onclick="toggleAsk()">✕</button></div>
  <div class="drawer-b" id="askBody"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>

 {t:'인바운드 이력 탭 연결 기준(계약/단지/연락처/사용자ID)',k:'ask',s:'설계 분기점',w:'개발',d:'8/22'},

  outbound:['통화 완료','부재','재통화 예정','방문 전환','종결'],

};

/* ---- 사이드바 (장면별 활성) ---- */
const NAV=[

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function bd(kind){
  if(kind==='P0')return '<span class="bdg b-p0">P0</span>';
  if(kind==='P1')return '<span class="bdg b-p1">P1</span>';
  if(kind==='P2')return '<span class="bdg b-p2">P2</span>';
  if(kind==='keep')return '<span class="bdg b-keep">기존 필드</span>';
  if(kind==='ro')return '<span class="bdg b-ro">표시 전용</span>';
  return '';
}
function tbd(t){return `<span class="bdg b-tbd">${esc(t||'미확정')}</span>`;}
function ask(t){return `<span class="bdg b-ask">${esc(t||'확인 필요')}</span>`;}
/* 입력 필드 */
function f(label,html,opt){
  opt=opt||{};
  const badges=[opt.p?bd(opt.p):'',opt.keep?bd('keep'):'',opt.tbd?tbd(opt.tbd):'',opt.ask?ask(opt.ask):''].filter(Boolean).join(' ');
  return `<div class="fld ${opt.keep?'keep':''}"><label>${opt.req?'<span class="req">*</span> ':''}${esc(label)} ${badges}</label>${html}${opt.hint?`<div class="hint">${opt.hint}</div>`:''}</div>`;
}
function inp(val,ph,attr){return `<input class="ctl" value="${esc(val||'')}" placeholder="${esc(ph||'')}" ${attr||''}>`;}
function sel(list,val,attr){return `<select class="ctl" ${attr||''}>${list.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;}
function dat(val,attr){return `<input type="date" class="ctl" value="${esc(val||'')}" ${attr||''}>`;}
function ta(val,ph,attr){return `<textarea class="ctl" placeholder="${esc(ph||'')}" ${attr||''}>${esc(val||'')}</textarea>`;}
function ro(val){return `<div class="ctl" style="background:var(--surface-2);color:var(--text-2)">${esc(val||'—')}</div>`;}

function toast(h){const w=document.getElementById('toastWrap');const e=document.createElement('div');e.className='toast';e.innerHTML=h;w.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .3s';setTimeout(()=>e.remove(),300);},2600);}

  } else if(EXTRACT==='submit'){
    cnt=SUBMIT_ROWS.length;
    table=`<table class="data"><thead><tr><th>단지명</th><th>소장</th><th>견적서 발송일</th><th>상정 예정일</th><th>상정 결과</th><th>소유</th></tr></thead>
      <tbody>${SUBMIT_ROWS.map(r=>`<tr><td>${esc(r.apt)}</td><td>${esc(r.person)}</td><td class="mono">${esc(r.quote)}</td><td class="mono">${esc(r.plan)}</td><td><span class="st st-hold">${esc(r.result)}</span></td><td>${esc(r.owner)}</td></tr>`).join('')}</tbody></table>`;
  } else if(EXTRACT==='people'){
    cnt=PEOPLE_ROWS.length;
    table=`<table class="data"><thead><tr><th>소장</th><th>연락처</th><th>근무지</th><th>프로모션 라벨</th><th>상담 상태값</th><th>최근 컨택</th><th>관련 건</th></tr></thead>
      <tbody>${PEOPLE_ROWS.map(r=>`<tr><td><b>${esc(r.person)}</b></td><td class="mono">${esc(r.phone)}</td><td>${esc(r.sites)}</td><td><span class="st st-new">${esc(r.promo)}</span></td><td><span class="st st-req">${esc(r.consult)}</span></td><td class="mono">${esc(r.last)}</td><td>${r.cnt}건</td></tr>`).join('')}</tbody></table>`;
  } else {
    table=`<div style="padding:34px;text-align:center;color:var(--text-3);font-size:12.5px">
      이 리스트는 <b>조건·필요 필드만 정의</b>된 상태입니다. 목업에는 대표 3종(D+3 아웃바운드 / 상정 미확인 / 프로모션 컨택 소장 목록)만 데이터를 넣었습니다.<br>
      <span style="font-size:11.5px">P1까지 필드가 들어가면 9종 전부 쿼리로 나옵니다 — 화면은 P2, 9월엔 엑셀로 충분.</span></div>`;
  }

  return `
  <div class="page-h"><h2>프로모션 추출</h2>
    <div style="display:flex;gap:8px;align-items:center">
      ${ask('화면 위치 — 매출관리 vs 성과분석')}
      <button class="btn primary" onclick="downloadCsv()">⤓ 엑셀 다운로드</button>
    </div>
  </div>
  <div class="note">장면 ④ — <b>P1까지 필드가 들어가면 9종이 전부 쿼리로 나온다.</b> 9월엔 화면 없이 <b>엑셀 다운로드</b>로 충분하고, 리스트 화면화는 P2다.</div>

  <div class="card"><div class="card-b">
    <div class="sec-t">추출 리스트 9종</div>
    <div class="pill-row">${chips}</div>
  </div></div>

  <div class="card">
    <div class="card-h">
      <div>
        <h3>${esc(cur.t)} ${cur.v02?'<span class="bdg b-p1">v0.2 추가</span>':''}</h3>
        <div style="font-size:11.5px;color:var(--text-3);margin-top:4px">조건 — ${esc(cur.cond)}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <span class="bdg ${cur.unit==='사람'?'b-p0':'b-p2'}">단위 ${esc(cur.unit)}</span>
        <span class="bdg b-p2">소유 ${esc(cur.own)}</span>
        ${cur.missing?tbd('7-6 목록 누락 — 적산 필요·처리 예정월'):''}
      </div>
    </div>
    <div class="card-b">
      <div style="font-size:11.5px;color:var(--text-3);margin-bottom:10px">필요 필드 — ${esc(cur.need)}</div>
      <div class="tbl-wrap">${table}</div>
      ${cnt?`<div style="margin-top:10px;font-size:12px;color:var(--text-2)">총 <b>${cnt}</b>${cur.unit==='사람'?'명':'건'}</div>`:''}
      ${EXTRACT==='d3'?`<div class="note warn" style="margin:12px 0 0">
        <b>사람 기준 묶음 행</b> — 1인 다단지 소장에게 하루 세 번 전화하지 않도록 <b>사람으로 묶고 관련 건을 하위에 편다</b> (§7-1).<br>
        <b>영업일 계산 주의</b> — D+3은 달력일이 아니라 영업일이고 <b>9/24~26 추석</b>이 낀다. 공휴일 테이블 없이 구현하면 추석 직후 대상이 통째로 어긋난다. ${ask('추출 단위 확정')}</div>`:''}
    </div>
  </div>

  <div class="card"><div class="card-h"><h3>9종 요약 · 중복 제거 단위 (§7-1)</h3></div><div class="card-b">
    <div class="tbl-wrap"><table class="data"><thead><tr><th>리스트</th><th>단위</th><th>소유</th><th>조건</th></tr></thead>
    <tbody>${EXTRACTS.map(e=>`<tr><td><b>${esc(e.t)}</b> ${e.data?'<span class="bdg b-keep">목업 데이터</span>':''}</td>
      <td><span class="bdg ${e.unit==='사람'?'b-p0':'b-p2'}">${esc(e.unit)}</span></td><td>${esc(e.own)}</td>
      <td style="font-size:11.5px;color:var(--text-2)">${esc(e.cond)} ${e.missing?tbd('필드 누락'):''}</td></tr>`).join('')}</tbody></table></div>
  </div></div>`;
}
function setExtract(k){EXTRACT=k;render();}
function downloadCsv(){
  const cur=EXTRACTS.find(e=>e.k===EXTRACT);
  let head=[],rows=[];
  if(EXTRACT==='d3'){
    head=['소장','연락처','단지명','견적서 발송일','경과','상담 상태값','다음 액션일','아웃바운드 결과'];
    D3_ROWS.forEach(p=>p.children.forEach(c=>rows.push([p.person,p.phone,c.apt,c.quote,c.elapsed,c.consult,c.next,'미기록'])));
  } else if(EXTRACT==='submit'){
    head=['단지명','소장','견적서 발송일','상정 예정일','상정 결과','소유'];
    rows=SUBMIT_ROWS.map(r=>[r.apt,r.person,r.quote,r.plan,r.result,r.owner]);
  } else if(EXTRACT==='people'){
    head=['소장','연락처','근무지','프로모션 라벨','상담 상태값','최근 컨택','관련 건'];
    rows=PEOPLE_ROWS.map(r=>[r.person,r.phone,r.sites,r.promo,r.consult,r.last,r.cnt+'건']);
  } else { toast('이 리스트는 목업 데이터가 없습니다 — 대표 3종만 제공'); return; }
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv='﻿'+[head.map(q).join(','),...rows.map(r=>r.map(q).join(','))].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='promo_extract_'+EXTRACT+'_20260920.csv';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast(`<b>${cur.t}</b> ${rows.length}행 다운로드 (UTF-8 BOM)`);
}

}
renderAsk();
render();
