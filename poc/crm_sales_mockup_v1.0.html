<!DOCTYPE html>
<html lang="ko">
<!--
  CRM 영업관리 목업 — crm_sales_mockup_v1.0.html
  근거: PRD 영업관리 신설 v2.0 / 통합 PRD v0.7 · 현행 화면 캡처 3종(계약상세 / 영업활동 도구 / 단지조회(신))
  · 껍데기: crm_promo_mockup 색 토큰·장면탭·날개패널 승계 / 레이아웃·필드순서는 캡처 우선
  · 단일 HTML · 인라인 CSS/JS · 스토리지 API 미사용 · 상태는 JS 메모리 변수
  · 실명 0건 — 캡처의 인명은 전부 가명(홍길동/임꺽정/성춘향)으로 교체, 단지명도 가공
  · 인바운드 등록 화면 캡처 미확보 → 지시서 §3 필드 목록으로 재현
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM 영업관리 목업 · v1.0</title>
<style>
:root{
  --brand:#006d8b; --brand-2:#2e87a0; --brand-strong:#005066;
  --brand-bg20:#f0f6f8; --brand-bg30:#e8f2f5;
  --text:#222222; --text-2:#54575e; --text-3:#7d8187;
  --bg:#ffffff; --page:#eef1f4; --surface-2:#f6f8f9; --surface-3:#eceff1;
  --border:#e0e2e6; --border-strong:#c6c9d0;
  --p0:#c0392b; --p0-bg:#fbe9e7;
  --p1:#b3690a; --p1-bg:#fbefdd;
  --p2:#7d8187; --p2-bg:#f0f1f4;
  --keep:#1f7a4d; --keep-bg:#e3f3ea;
  --tbd:#b3690a; --tbd-bg:#fff6e8; --tbd-border:#e6b877;
  --ask:#6d4bb0; --ask-bg:#efeaf9; --ask-border:#c9b8e8;
  --r:8px; --r-lg:12px; --shadow:0 1px 3px rgba(20,30,40,.08),0 1px 2px rgba(20,30,40,.05);
  /* 계약상태 — 캡처 색 매핑 */
  --s-req:#e02f5a; --s-ctr:#2563eb; --s-run:#38a3d8; --s-done:#8b9199; --s-kill:#e8912a; --s-hold:#b3690a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,'Malgun Gothic','맑은 고딕',sans-serif;
  background:var(--page);color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{margin:0;font-weight:600;}
table{border-collapse:collapse;width:100%;}
input,select,textarea{font-family:inherit;}

/* 목업 툴바 */
.mockbar{position:sticky;top:0;z-index:80;background:#1c2430;color:#fff;display:flex;align-items:center;gap:14px;padding:9px 20px;}
.mockbar .mb-title{font-size:14px;font-weight:700;white-space:nowrap;}
.mockbar .mb-title small{font-weight:400;opacity:.75;font-size:11px;margin-left:7px;}
.mockbar .sp{flex:1;}
.scene-tabs{display:flex;background:rgba(255,255,255,.12);border-radius:8px;padding:3px;}
.scene-tabs button{border:none;background:transparent;color:rgba(255,255,255,.78);padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;}
.scene-tabs button.active{background:#fff;color:#1c2430;font-weight:700;}
.mb-btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:5px 12px;border-radius:7px;font-size:12px;white-space:nowrap;}
.mb-btn:hover{background:rgba(255,255,255,.12);}
.mb-btn .cnt{background:var(--tbd);color:#fff;border-radius:9px;font-size:9.5px;padding:0 5px;margin-left:4px;font-weight:700;}

/* 안내줄 */
.poc-bar{background:var(--p0-bg);border-bottom:1px solid #f0cdc7;color:#8a3025;font-size:11.5px;padding:6px 20px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
.poc-bar b{font-weight:700;}
.poc-bar .sep{color:#d8b0aa;}

/* 상단 글로벌 헤더 (캡처 재현) */
.gnb{background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:8px 18px;}
.gnb .brand{display:flex;align-items:center;gap:12px;width:190px;flex:0 0 auto;}
.gnb .brand .lg{font-size:15px;font-weight:800;color:var(--brand);letter-spacing:-.4px;}
.gnb .brand .lg small{display:block;font-size:8px;font-weight:500;color:var(--text-3);letter-spacing:.06em;}
.gnb .ham{border:none;background:transparent;color:var(--text-2);font-size:15px;padding:2px 5px;border-radius:5px;}
.gnb .ham:hover{background:var(--surface-3);}
.gnb .c{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;}
.gnb .r{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.gbtn{border:1px solid var(--border-strong);background:#fff;color:var(--text-2);padding:5px 11px;border-radius:7px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.gbtn:hover{border-color:var(--brand);color:var(--brand);}
.gbtn.tel{border-color:#31a06f;color:#238156;}
.gbtn.off{opacity:.45;cursor:not-allowed;}
.gbtn.wait{border-color:var(--brand);color:var(--brand);background:var(--brand-bg20);}
.gnb .telin{border:1px solid var(--border-strong);border-radius:7px;padding:5px 11px;font-size:12px;width:260px;min-height:30px;}
.gnb .me{font-size:12px;color:var(--text-2);white-space:nowrap;}

/* 레이아웃 */
.app{display:grid;grid-template-columns:206px 1fr;max-width:1720px;margin:0 auto;min-height:70vh;background:var(--bg);}
.lnb{background:#fff;border-right:1px solid var(--border);padding:12px 0;}
.lnb-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:transparent;padding:9px 16px;font-size:13px;color:var(--text-2);}
.lnb-item:hover{background:var(--surface-2);}
.lnb-item.active{background:var(--brand-bg20);color:var(--brand);font-weight:700;box-shadow:inset 3px 0 0 var(--brand);}
.lnb-item .ic{width:15px;text-align:center;opacity:.75;font-size:12px;}
.lnb-item .dot{width:5px;height:5px;border-radius:50%;background:var(--p0);margin-left:2px;}
.lnb-item .ar{margin-left:auto;font-size:9px;color:var(--text-3);}
.lnb-sub{display:block;width:100%;text-align:left;border:none;background:transparent;padding:7px 16px 7px 39px;font-size:12.5px;color:var(--text-3);}
.lnb-sub:hover{background:var(--surface-2);}
.lnb-sub.active{color:var(--brand);font-weight:700;background:var(--brand-bg20);}
.lnb-sub.isnew::after{content:'신규';margin-left:6px;font-size:9px;font-weight:700;color:#fff;background:var(--p0);border-radius:3px;padding:0 4px;vertical-align:1px;}
.main{padding:16px 24px 70px;min-width:0;}
.crumb{font-size:12px;color:var(--text-3);margin-bottom:10px;}
.crumb b{color:var(--text);font-weight:600;}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;flex-wrap:wrap;}
.page-h h2{font-size:19px;}
.page-h .sub{font-size:11.5px;color:var(--text-3);font-weight:400;margin-top:2px;}

/* 배지 */
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;vertical-align:middle;white-space:nowrap;letter-spacing:-.2px;}
.b-new{background:var(--p0);color:#fff;}
.b-ask{background:var(--ask-bg);color:var(--ask);border:1px dashed var(--ask-border);}
.b-ask::before{content:'? ';}
.b-ro{background:var(--surface-3);color:var(--text-3);border:1px solid var(--border-strong);}
.b-cur{background:var(--keep-bg);color:var(--keep);border:1px solid #bfe3d0;}

/* 카드/폼 */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:13px;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.card-h h3{font-size:14px;}
.card-b{padding:14px 16px;}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px 16px;}
.span2{grid-column:span 2;}
.span3{grid-column:span 3;}
.fld{min-width:0;}
.fld label{display:block;font-size:11.5px;color:var(--text-2);margin-bottom:5px;font-weight:500;}
.fld label .req{color:var(--p0);}
.ctl{width:100%;border:1px solid var(--border-strong);border-radius:var(--r);padding:7px 10px;font-size:12.5px;background:#fff;color:var(--text);min-height:33px;}
.ctl::placeholder{color:#b3b8bd;}
.ctl:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-bg30);}
.ctl[readonly],.ctl:disabled{background:var(--surface-2);color:var(--text-3);}
textarea.ctl{min-height:70px;resize:vertical;}
.hint{font-size:10.5px;color:var(--text-3);margin-top:4px;}
.sec-div{height:1px;background:var(--border);margin:17px 0;}
.sec-t{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:11px;display:flex;align-items:center;gap:7px;}
.sec-t::before{content:'';width:3px;height:12px;background:var(--brand);border-radius:2px;}
.fld-row{display:flex;gap:7px;align-items:stretch;}
.fld-row .ctl{flex:1;}
.fld.isnew label{color:var(--p0);font-weight:700;}
.fld.isnew .ctl{border-color:var(--p0);background:#fffafa;}
.amt{text-align:right;font-variant-numeric:tabular-nums;}
.calc{background:var(--brand-bg20)!important;border-color:var(--brand)!important;color:var(--brand-strong)!important;font-weight:700;}
.subcard{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px 15px;margin-top:14px;}
.subcard .st-t{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:11px;}

/* 버튼 */
.btn{border:1px solid var(--border-strong);background:#fff;color:var(--text-2);padding:7px 13px;border-radius:var(--r);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.btn:hover{border-color:var(--brand);color:var(--brand);}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.btn.primary:hover{background:var(--brand-strong);color:#fff;}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.sm{padding:5px 10px;font-size:11.5px;}
.btn.xs{padding:3px 8px;font-size:11px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* 테이블 */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--r-lg);overflow:auto;background:#fff;}
table.data{font-size:12.5px;}
table.data th{background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:11.5px;text-align:left;padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.data td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
table.data tr:last-child td{border-bottom:none;}
table.data tbody tr:hover td{background:var(--surface-2);}
table.data td.num,table.data th.num{text-align:right;}
table.data td.num{font-variant-numeric:tabular-nums;}
table.data .lnk{color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
table.data .muted{color:var(--text-3);}
.empty-row td{text-align:center!important;color:var(--text-3);padding:26px 10px!important;}

/* 상태 pill — 색 + 글자 (캡처 재현) */
.st{font-size:10.5px;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;display:inline-block;color:#fff;}
.st-req{background:var(--s-req);} .st-ctr{background:var(--s-ctr);} .st-run{background:var(--s-run);}
.st-done{background:var(--s-done);} .st-kill{background:var(--s-kill);} .st-hold{background:#fff;color:var(--s-hold);border:1px solid var(--s-hold);}
.st-o{background:var(--keep-bg);color:var(--keep);border:1px solid #bfe3d0;}
.st-x{background:var(--p2-bg);color:var(--text-3);border:1px solid var(--border-strong);}
.st-m{background:var(--p1-bg);color:var(--p1);border:1px solid #e6c58f;}
.mono{font-family:'IBM Plex Mono',ui-monospace,'Courier New',monospace;}

/* 조건 영역 */
.filterbar{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:11px;box-shadow:var(--shadow);}
.daterange{display:flex;align-items:center;gap:6px;}
.daterange .ctl{min-width:0;}
.daterange span{color:var(--text-3);font-size:12px;}
.fb-act{display:flex;align-items:flex-end;gap:7px;}
.fb-act .btn{height:33px;}
.srch{position:relative;}
.srch .ctl{padding-left:29px;}
.srch::before{content:'🔍';position:absolute;left:9px;top:8px;font-size:12px;opacity:.5;}
.rowcnt{font-size:12.5px;color:var(--text-2);margin:0 2px 9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.rowcnt b{color:var(--brand);font-weight:700;}
.rowcnt .sortnote{color:var(--text-3);font-size:11.5px;}

/* 페이지네이션 */
.pager{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:14px;}
.pager button{border:1px solid var(--border);background:#fff;color:var(--text-2);min-width:29px;height:29px;border-radius:6px;font-size:12px;padding:0 6px;}
.pager button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;}
.pager button:disabled{opacity:.4;cursor:not-allowed;}

/* 관리콜 이력 */
.callrow{display:flex;gap:7px;align-items:center;margin-bottom:7px;}
.callrow .ctl{min-height:31px;padding:5px 9px;}
.callrow .d{width:150px;flex:0 0 auto;}
.hist-box{border:1px solid var(--border);border-radius:var(--r);padding:11px;background:var(--surface-2);}
.hist-empty{font-size:11.5px;color:var(--text-3);padding:3px 2px 9px;}
.drop{border:1px dashed var(--border-strong);border-radius:var(--r);padding:12px;background:var(--surface-2);font-size:12px;color:var(--text-3);}

/* 변경이력 */
.chg{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px;}
.chg:last-child{border-bottom:none;}
.chg .av{width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:10px;flex:0 0 auto;}
.chg .who{font-weight:600;font-size:11.5px;}
.chg .when{color:var(--text-3);font-size:11px;margin-left:6px;font-weight:400;}
.chg .what{color:var(--text-2);font-size:12px;}

/* 탭 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 14px;background:#fff;border-radius:12px 12px 0 0;overflow-x:auto;}
.tab{border:none;background:transparent;padding:11px 13px 9px;font-size:12.5px;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:700;}

/* 콜아웃 */
.note{background:var(--brand-bg20);border:1px solid #cfe4ea;border-radius:var(--r-lg);padding:10px 14px;font-size:12px;color:var(--brand-strong);margin-bottom:13px;}
.note.warn{background:var(--tbd-bg);border-color:var(--tbd-border);color:#8a5a1a;}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chip{border:1px solid var(--border);background:#fff;color:var(--text-2);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:500;}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}

/* 날개 패널 */
.ask-panel{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:94vw;background:#fff;border-left:1px solid var(--border);box-shadow:-8px 0 28px rgba(0,0,0,.16);z-index:130;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;}
.ask-panel.show{transform:none;}
.drawer-h{padding:15px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.drawer-h h3{font-size:15px;}
.drawer-b{padding:16px 18px;overflow-y:auto;flex:1;}
.ask-row{border-left:3px solid var(--ask);background:var(--surface-2);border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:8px;font-size:12px;}
.ask-row.find{border-left-color:var(--p0);background:var(--p0-bg);}
.ask-row .ar-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;}
.ask-row .ar-when{font-size:10.5px;color:var(--text-3);font-weight:700;white-space:nowrap;}
.ask-row .ar-who{font-size:10.5px;color:var(--text-3);}

/* 모달 */
.modal-back{position:fixed;inset:0;background:rgba(16,22,30,.46);z-index:120;display:flex;align-items:flex-start;justify-content:center;padding:70px 20px 30px;overflow-y:auto;}
.modal{background:#fff;border-radius:14px;box-shadow:0 18px 48px rgba(0,0,0,.28);width:100%;max-width:640px;display:flex;flex-direction:column;max-height:calc(100vh - 110px);}
.modal-h{padding:15px 20px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.modal-h h3{font-size:15px;}
.modal-b{padding:16px 20px;overflow-y:auto;flex:1;}
.modal-f{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2);border-radius:0 0 14px 14px;}

/* 토스트 */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:#242c36;color:#fff;padding:10px 18px;border-radius:10px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:560px;}
.toast b{color:#7ecfe0;}

/* As-Is 좌측 나열형 (캡처 재현) */
.asis{display:grid;grid-template-columns:300px 1fr;gap:12px;align-items:start;}
.asis-col{border:1px solid var(--border);border-radius:var(--r-lg);background:#fff;overflow:hidden;}
.asis-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;border-bottom:1px solid var(--border);}
.asis-hd b{font-size:13px;}
.asis-srch{padding:10px 13px;border-bottom:1px solid var(--border);}
.asis-li{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--border);background:transparent;padding:11px 13px;}
.asis-li:hover{background:var(--surface-2);}
.asis-li.on{background:var(--brand-bg20);box-shadow:inset 3px 0 0 var(--brand);}
.asis-li .t{flex:1;min-width:0;}
.asis-li .t b{display:block;font-size:12.5px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.asis-li .t small{display:block;color:var(--text-3);font-size:11px;margin-top:2px;}
.scene{display:none;}
.scene.active{display:block;}
</style>
</head>
<body>

<div class="mockbar">
  <div class="mb-title">CRM 영업관리 목업 <small>v1.0 · 2026-08-26</small></div>
  <div class="sp"></div>
  <div class="scene-tabs" id="sceneTabs">
    <button class="active" onclick="setScene(1)">① 영업이력 등록</button>
    <button onclick="setScene(2)">② 영업이력 목록</button>
    <button onclick="setScene(3)">③ 인바운드</button>
    <button onclick="setScene(4)">④ 계약 상세</button>
    <button onclick="setScene(5)">⑤ 계약 목록</button>
  </div>
  <button class="mb-btn" onclick="toggleAsk()">확인 필요<span class="cnt" id="askCnt">0</span></button>
  <button class="mb-btn" onclick="resetAll()">↻ 리셋</button>
</div>

<div class="poc-bar">
  <b>목업 — 실제로 저장되지 않습니다.</b>

function pager(pages,cur,fn){
  let h=`<button onclick="${fn}(1)" ${cur<=1?'disabled':''}>«</button><button onclick="${fn}(${cur-1})" ${cur<=1?'disabled':''}>‹</button>`;
  for(let i=1;i<=pages;i++)h+=`<button class="${i===cur?'on':''}" onclick="${fn}(${i})">${i}</button>`;
  h+=`<button onclick="${fn}(${cur+1})" ${cur>=pages?'disabled':''}>›</button><button onclick="${fn}(${pages})" ${cur>=pages?'disabled':''}>»</button>`;
  return h;
}

function sfset(k,v){SF[k]=v;}
function salesRows(){
  let r=SALES.slice();
  if(SF.type!=='전체')r=r.filter(x=>x.type===SF.type);
  if(SF.owner!=='전체')r=r.filter(x=>x.owner===SF.owner);
  if(SF.region!=='전체')r=r.filter(x=>x.region===SF.region);
  if(SF.prob!=='전체')r=r.filter(x=>x.prob===SF.prob);
  if(SF.promo!=='전체')r=r.filter(x=>x.promo===SF.promo);
  if(SF.from)r=r.filter(x=>x.date>=SF.from);
  if(SF.to)r=r.filter(x=>x.date<=SF.to);
  const q=SF.q.trim();
  if(q)r=r.filter(x=>(x.apt+x.cust+x.owner).includes(q));
  r.sort((a,b)=>(a.call||'9999').localeCompare(b.call||'9999'));
  return r;

/* =========================================================
   ⑤ 계약 목록 — 좌측 나열형 → 표 형태 (단지조회(신) 구성)
   ========================================================= */
function cfset(k,v){CF[k]=v;}
function ctrRows(){
  let r=CTR.map((x,i)=>Object.assign({no:i+1},x));
  if(CF.state!=='전체')r=r.filter(x=>x.state===CF.state);
  if(CF.product!=='전체')r=r.filter(x=>x.product===CF.product);
  if(CF.partner!=='전체')r=r.filter(x=>x.partner===CF.partner);
  if(CF.promo!=='전체')r=r.filter(x=>x.promo===CF.promo);
  if(CF.owner!=='전체')r=r.filter(x=>x.owner===CF.owner);
  if(CF.from)r=r.filter(x=>x.cd>=CF.from);
  if(CF.to)r=r.filter(x=>x.cd<=CF.to);
  const q=CF.q.trim();
  if(q)r=r.filter(x=>(x.name+x.apt).includes(q));
  return r;
}
function renderCtr(){
  const all=ctrRows(), pages=Math.max(1,Math.ceil(all.length/PAGE));
  if(PG_C>pages)PG_C=pages;
  const rows=all.slice((PG_C-1)*PAGE,PG_C*PAGE);
  const c=document.getElementById('ctrCnt');if(c)c.innerHTML=`총 <b>${all.length}</b>건`;
  const b=document.getElementById('ctrBody');if(!b)return;
  b.innerHTML=rows.length?rows.map(x=>`<tr>
      <td class="muted">${x.no}</td>
      <td><span class="lnk" onclick="openCtr(${x.no-1})">${esc(x.name)}</span></td>
      <td>${esc(x.apt)}</td>
      <td><span class="st ${ctrCls(x.state)}">${esc(x.state)}</span></td>
      <td>${esc(x.product)}</td><td>${esc(x.partner)}</td>
      <td class="mono">${esc(x.cd)}</td><td class="mono">${esc(x.ed)}</td>
      <td class="num">${won(x.amt)}</td>
      <td>${x.owner?esc(x.owner):'<span class="muted">미지정</span>'}</td>
      <td>${x.promo==='해당없음'?'<span class="muted">해당없음</span>':`<span class="st st-o">${esc(x.promo)}</span>`}</td></tr>`).join('')
    :'<tr class="empty-row"><td colspan="11">조건에 맞는 계약이 없습니다.</td></tr>';
  document.getElementById('ctrPager').innerHTML=pager(pages,PG_C,'goCtr');
}

function resetCtrFilter(){CF={state:'전체',product:'전체',partner:'전체',from:'',to:'',promo:'전체',owner:'전체',q:''};PG_C=1;render();toast('조건을 초기화했습니다');}
function setCtrView(v){CTR_VIEW=v;render();}
function openCtr(i){const x=CTR[i];CD=SEED_CD();CD.name=x.name;CD.state=x.state;CD.product=x.product;CD.partner=x.partner;
  CD.cd=x.cd;CD.ed=x.ed;CD.revAmt=x.amt;CD.salesOwner=x.owner;CD.promo=promoOf(x.cd);CD.promoTouched=false;
  TAB4=0;setScene(4);}
function pickAsis(i){CTR_PICK=i;render();}

function scene5(){
  const isT=CTR_VIEW==='table';
  return `
  <div class="page-h">
    <div><h2>계약관리</h2><div class="sub">좌측 나열형을 표 형태로 바꿉니다 ${bNew()}</div></div>
    <div class="pill-row">
      <button class="chip ${!isT?'active':''}" onclick="setCtrView('asis')">현재 — 좌측 나열형</button>
      <button class="chip ${isT?'active':''}" onclick="setCtrView('table')">개선 — 표 형태</button>
    </div>
  </div>
  ${isT?ctrTable():ctrAsis()}`;
}

function ctrAsis(){
  const x=CTR[CTR_PICK];
  return `
  <div class="note warn">현재 구조입니다. 한 화면에 <b>여덟 건 남짓</b>만 보이고, 어떤 건인지 알려면 <b>하나씩 눌러봐야</b> 합니다. 상태·금액·날짜를 나란히 놓고 비교할 수 없고, 조건으로 좁힐 수도 없습니다.</div>
  <div class="asis">
    <div class="asis-col">
      <div class="asis-hd"><b>계약관리</b>
        <span class="pill-row"><button class="btn xs" onclick="navClick()">엑셀 다운로드</button><button class="btn xs primary" onclick="navClick()">신규 등록</button></span></div>
      <div class="asis-srch"><div class="srch"><input class="ctl" placeholder="이름, 연락처, 이메일로 검색하세요."></div></div>
      ${CTR.slice(0,8).map((c,i)=>`<button class="asis-li ${i===CTR_PICK?'on':''}" onclick="pickAsis(${i})">
        <span class="t"><b>계약정보명</b><small>${esc(c.product)} | ${esc(c.partner)}</small></span>
        <span class="st ${ctrCls(c.state)}">${esc(c.state)}</span></button>`).join('')}
    </div>
    <div class="card" style="margin:0"><div class="card-h"><h3>${esc(x.name)}</h3>
      <span class="st ${ctrCls(x.state)}">${esc(x.state)}</span></div>
      <div class="card-b"><div class="grid3">
        <div class="fld"><label>상품 구분</label><input class="ctl" value="${esc(x.product)}" disabled></div>
        <div class="fld"><label>제휴사</label><input class="ctl" value="${esc(x.partner)}" disabled></div>
        <div class="fld"><label>계약일</label><input class="ctl mono" value="${esc(x.cd)}" disabled></div>
        <div class="fld"><label>계약종료일</label><input class="ctl mono" value="${esc(x.ed)}" disabled></div>
        <div class="fld"><label>매출액</label><input class="ctl amt" value="${won(x.amt)}" disabled></div>
        <div class="fld"><label>단지명</label><input class="ctl" value="${esc(x.apt)}" disabled></div>
      </div>
      <div class="hint" style="margin-top:12px">이 값들을 다른 계약과 비교하려면 좌측에서 다른 건을 눌러 다시 읽어야 합니다.</div>
      </div></div>
  </div>`;
}

function ctrTable(){
  return `
  <div class="filterbar">
    <div class="grid4">
      <div class="fld"><label>계약상태</label>
        <select class="ctl" onchange="cfset('state',this.value)">${opts(OPT.ctrState,CF.state,'전체')}</select></div>
      <div class="fld"><label>상품 구분</label>
        <select class="ctl" onchange="cfset('product',this.value)">${opts(OPT.ctrProduct,CF.product,'전체')}</select></div>
      <div class="fld"><label>제휴사</label>
        <select class="ctl" onchange="cfset('partner',this.value)">${opts(OPT.partner,CF.partner,'전체')}</select></div>
      <div class="fld"><label>계약시작일 ~ 계약종료일</label>
        <div class="daterange">
          <input type="date" class="ctl" value="${esc(CF.from)}" onchange="cfset('from',this.value)">
          <span>~</span>
          <input type="date" class="ctl" value="${esc(CF.to)}" onchange="cfset('to',this.value)">
        </div></div>
      <div class="fld"><label>프로모션 차수 ${bNew()}</label>
        <select class="ctl" onchange="cfset('promo',this.value)">${opts(OPT.promo,CF.promo,'전체')}</select></div>
      <div class="fld"><label>영업 담당자 ${bNew()}</label>
        <select class="ctl" onchange="cfset('owner',this.value)">${opts(OPT.owner,CF.owner,'전체')}</select></div>
      <div class="fb-act span2">
        <div class="fld srch" style="flex:1"><label>통합 검색</label>
          <input class="ctl" placeholder="계약명, 단지명 검색" value="${esc(CF.q)}" onchange="cfset('q',this.value)"></div>
        <button class="btn" onclick="resetCtrFilter()">초기화</button>
        <button class="btn primary" onclick="searchCtr()">검색</button>
      </div>
    </div>
  </div>

  <div class="rowcnt"><span id="ctrCnt"></span>
    <span class="sortnote">· 계약상태를 목록에서 바로 구분할 수 있습니다</span>
    <span style="flex:1"></span>
    <button class="btn sm" onclick="toast('엑셀 파일이 내려받아집니다 <b>(목업)</b> · 영업담당자·프로모션 차수·견적서 발송일 포함')">엑셀 다운로드</button>
    <button class="btn sm primary" onclick="toast('신규 계약 등록 — 목업 범위 밖')">＋ 신규 등록</button>
  </div>
  <div class="tbl-wrap">
    <table class="data">
      <thead><tr>
        <th>NO</th><th>계약명</th><th>단지명</th><th>계약상태</th><th>상품 구분</th><th>제휴사</th>
        <th>계약일</th><th>계약종료일</th><th class="num">매출액</th><th>영업 담당자</th><th>프로모션 차수</th>
      </tr></thead>
      <tbody id="ctrBody"></tbody>
    </table>
  </div>
  <div class="pager" id="ctrPager"></div>`;
}

/* =========================================================
   렌더
   ========================================================= */
function setScene(n){SCENE=n;APT_MODAL=false;
  document.querySelectorAll('#sceneTabs button').forEach((b,i)=>b.classList.toggle('active',i===n-1));
  render();}
function render(){
  renderNav();renderModal();
  document.getElementById('sceneHost').innerHTML={1:scene1,2:scene2,3:scene3,4:scene4,5:scene5}[SCENE]();
  document.getElementById('crumb').innerHTML=CRUMB[SCENE];
  if(SCENE===1){renderHist();renderChg();calcSum();}
  if(SCENE===2)renderSales();
  if(SCENE===4&&TAB4===0)updPromoNote();
  if(SCENE===5&&CTR_VIEW==='table')renderCtr();
}
renderAsk();
render();
</script>
</body>
</html>
