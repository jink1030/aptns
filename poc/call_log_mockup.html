<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM 상담사별 통화목록 목업 v0.1</title>
<!--
  ============================================================================
  CRM 상담사별 통화목록 목업 v0.1 · 2026-09-15
  ----------------------------------------------------------------------------
  [톤앤매너 기준 파일]
    inbound_match_prototype_v0.1.html (인바운드 매칭 개선 목업 v0.1, 2026-08-24)
    → PRD §3 재사용 지시의 1순위 파일. 전문을 확보하여 시각 언어를 그대로 승계.
    승계 항목: :root 색 토큰 전체 / .mockbar · .scene-tabs / .lnb · .crumb /
              .card · .fld · .ctl / .matchcard / .linkstrip(=.summary-strip) /
              .fold / .toast / .ask-panel / .btn · .bdg 계열 / table.data / 리셋 버튼

    토큰 정본 계보: crm_sales.html 미보유 → crm_promo_mockup_v0.5.html이
    Figma CRM Design System(fileKey I9klB2o8wDhuq9z5oMQMid) 추출값을 헤더에 명시 →
    inbound_match_prototype_v0.1.html이 그 토큰을 그대로 승계 → 본 파일이 승계.
    본 파일에서 새로 정의한 색상은 없다. 신규 상태색(미연결·미매칭·이상데이터)은
    전부 기존 토큰(--p0 / --p1 / --p2 / --tbd / --ask / --keep 계열) 조합이다.

  [신규 정의 클래스 — 전부 기존 토큰 조합]
    .summary-strip / .ss-item   → .linkstrip 레이아웃 + .card 테두리 조합
    .row-dead / .row-bad        → --p1-bg / --p0-bg 배경 틴트
    .anom                       → --p0 인라인 이상데이터 마커
    .mc-src                     → .matchcard 내부 매핑 출처 줄

  [기술 제약] 단일 HTML · CSS/JS 인라인 · 외부 라이브러리 0 ·
             localStorage/sessionStorage 미사용 (상태는 전부 JS 변수)
  ============================================================================
-->
<style>
:root{
  --brand:#006d8b; --brand-2:#2e87a0; --brand-strong:#005066;
  --brand-bg20:#f0f6f8; --brand-bg30:#e8f2f5;
  --text:#222222; --text-2:#54575e; --text-3:#7d8187;
  --bg:#ffffff; --page:#eef1f4; --surface-2:#f6f8f9; --surface-3:#eceff1;
  --border:#e0e2e6; --border-strong:#c6c9d0; --divider:#d4d7dc;
  --p0:#c0392b; --p0-bg:#fbe9e7;
  --p1:#b3690a; --p1-bg:#fbefdd;
  --p2:#7d8187; --p2-bg:#f0f1f4;
  --keep:#1f7a4d; --keep-bg:#e3f3ea;
  --tbd:#b3690a; --tbd-bg:#fff6e8; --tbd-border:#e6b877;
  --ask:#6d4bb0; --ask-bg:#efeaf9; --ask-border:#c9b8e8;
  --pink:#d81b60; --pink-bg:#fce4ec;
  --r:8px; --r-lg:12px; --shadow:0 1px 3px rgba(20,30,40,.08),0 1px 2px rgba(20,30,40,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,'Malgun Gothic','맑은 고딕',sans-serif;
  background:var(--page);color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{margin:0;font-weight:600;}
table{border-collapse:collapse;width:100%;}
input,select,textarea{font-family:inherit;}

/* ===== 목업 툴바 (승계) ===== */
.mockbar{position:sticky;top:0;z-index:80;background:#1c2430;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 18px;flex-wrap:wrap;}
.mockbar .mb-title{font-size:14px;font-weight:700;}
.mockbar .mb-title small{font-weight:400;opacity:.75;font-size:11px;margin-left:7px;}
.mockbar .sp{flex:1;}
.mb-grp{display:flex;align-items:center;gap:6px;}
.mb-grp>.lb{font-size:10.5px;color:rgba(255,255,255,.6);font-weight:700;letter-spacing:-.2px;white-space:nowrap;}
.scene-tabs{display:flex;background:rgba(255,255,255,.12);border-radius:8px;padding:3px;}
.scene-tabs button{border:none;background:transparent;color:rgba(255,255,255,.78);padding:5px 11px;border-radius:6px;font-size:11.5px;font-weight:500;white-space:nowrap;}
.scene-tabs button.active{background:#fff;color:#1c2430;font-weight:700;}
.mb-btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:5px 12px;border-radius:7px;font-size:12px;}
.mb-btn:hover{background:rgba(255,255,255,.12);}
.mb-btn .cnt{background:var(--tbd);color:#fff;border-radius:9px;font-size:9.5px;padding:0 5px;margin-left:4px;font-weight:700;}
.mb-tbd{font-size:9.5px;font-weight:700;color:#ffd9a0;border:1px dashed rgba(255,217,160,.55);border-radius:4px;padding:0 4px;white-space:nowrap;}
.mb-row2{background:#243040;color:#fff;display:flex;align-items:center;gap:16px;padding:7px 18px;flex-wrap:wrap;position:sticky;top:41px;z-index:79;}

/* ===== 레이아웃 (승계) ===== */
.app{display:grid;grid-template-columns:220px 1fr;max-width:1680px;margin:0 auto;min-height:calc(100vh - 82px);background:var(--bg);}
.lnb{background:#fff;border-right:1px solid var(--border);padding:14px 0;}
.lnb .logo{font-size:14px;font-weight:800;color:var(--brand);padding:4px 18px 14px;letter-spacing:-.3px;}
.lnb-item{display:block;width:100%;text-align:left;border:none;background:transparent;padding:9px 18px;font-size:13px;color:var(--text-2);}
.lnb-item:hover{background:var(--surface-2);}
.lnb-item.active{background:var(--brand-bg20);color:var(--brand);font-weight:700;box-shadow:inset 3px 0 0 var(--brand);}
.lnb-sub{display:block;width:100%;text-align:left;border:none;background:transparent;padding:7px 18px 7px 34px;font-size:12.5px;color:var(--text-3);}
.lnb-sub.active{color:var(--brand);font-weight:700;background:var(--brand-bg20);}
.lnb-div{height:1px;background:var(--border);margin:10px 14px;}
.main{padding:18px 26px 70px;min-width:0;position:relative;}
.crumb{font-size:12px;color:var(--text-3);margin-bottom:12px;}
.crumb b{color:var(--text);font-weight:600;}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.page-h h2{font-size:19px;}

/* ===== 배지 (승계) ===== */
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;vertical-align:middle;white-space:nowrap;letter-spacing:-.2px;}
.b-keep{background:var(--keep-bg);color:var(--keep);border:1px solid #bfe3d0;}
.b-tbd{background:var(--tbd-bg);color:var(--tbd);border:1px dashed var(--tbd-border);}
.b-tbd::before{content:'⚠ ';}
.b-ask{background:var(--ask-bg);color:var(--ask);border:1px dashed var(--ask-border);}
.b-ask::before{content:'? ';}
.b-ro{background:var(--surface-3);color:var(--text-3);border:1px solid var(--border-strong);}
.b-new{background:var(--p0);color:#fff;}
.b-recent{background:var(--brand-bg30);color:var(--brand-strong);border:1px solid #bfe0e6;}
.b-past{background:var(--surface-3);color:var(--text-3);border:1px solid var(--border-strong);}
.b-more{background:var(--p1-bg);color:var(--p1);border:1px solid #e8c894;}
.b-vid{background:var(--ask-bg);color:var(--ask);border:1px solid var(--ask-border);}
.b-unk{background:var(--p2-bg);color:var(--text-3);border:1px solid var(--border-strong);}
.b-out{background:var(--brand-bg30);color:var(--brand-strong);border:1px solid #bfe0e6;}
.b-in{background:var(--keep-bg);color:var(--keep);border:1px solid #bfe3d0;}

/* ===== 카드/폼 (승계) ===== */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:14px;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.card-h h3{font-size:14px;}
.card-b{padding:14px 16px;}
.fld{min-width:0;}
.fld label{display:block;font-size:11.5px;color:var(--text-2);margin-bottom:5px;font-weight:500;}
.ctl{width:100%;border:1px solid var(--border-strong);border-radius:var(--r);padding:7px 10px;font-size:12.5px;background:#fff;color:var(--text);min-height:32px;}
.ctl:focus{outline:none;border-color:var(--brand);}
.ctl[readonly],.ctl:disabled{background:var(--surface-2);color:var(--text-3);}
.hint{font-size:10.5px;color:var(--text-3);margin-top:4px;}
.sec-t{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:10px;}
.filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.filter-row .fld{flex:0 0 auto;}
.filter-row .fld.wide{flex:1 1 200px;min-width:180px;}

/* 버튼 (승계) */
.btn{border:1px solid var(--border-strong);background:#fff;color:var(--text-2);padding:7px 13px;border-radius:var(--r);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:5px;}
.btn:hover{border-color:var(--brand);color:var(--brand);}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.btn.primary:hover{background:var(--brand-strong);color:#fff;}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.sm{padding:5px 10px;font-size:11.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* 테이블 (승계) */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--r-lg);overflow:auto;background:#fff;}
table.data{font-size:12.5px;}
table.data th{background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:11.5px;text-align:left;padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.data th.sortable{cursor:pointer;user-select:none;}
table.data th.sortable:hover{color:var(--brand);}
table.data th .sar{color:var(--brand);font-size:10px;margin-left:2px;}
table.data td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.data tbody tr.pick{cursor:pointer;}
table.data tbody tr.pick:hover td{background:var(--brand-bg20);}
table.data tbody tr.open td{background:var(--brand-bg20);}
table.data tbody tr.row-dead td{background:var(--p1-bg);}
table.data tbody tr.row-dead.open td{background:#f7e7cf;}
table.data tbody tr.row-dead:hover td{background:#f7e7cf;}
tr.det td{background:var(--surface-2)!important;padding:0;}
.st{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block;}
.st-ok{color:var(--keep);background:var(--keep-bg);}
.st-dead{color:var(--p1);background:var(--p1-bg);border:1px solid #e8c894;}
.st-nc{color:var(--p0);background:var(--p0-bg);border:1px solid #f0cdc7;}
.st-tr{color:var(--ask);background:var(--ask-bg);border:1px solid var(--ask-border);}
.mono{font-family:'IBM Plex Mono',ui-monospace,'Courier New',monospace;}
.muted{color:var(--text-3);}
.anom{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--p0);background:var(--p0-bg);border:1px dashed #e8b3aa;border-radius:4px;padding:1px 5px;margin-left:5px;white-space:nowrap;}
.exp{display:inline-block;width:14px;color:var(--text-3);font-size:10px;}
.empty-st{padding:40px 16px;text-align:center;color:var(--text-3);font-size:13px;}

/* ===== 요약 스트립 (.linkstrip 레이아웃 승계 + .card 테두리) ===== */
.summary-strip{display:flex;gap:0;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
.ss-item{flex:1 1 0;min-width:150px;border:none;border-right:1px solid var(--border);background:#fff;text-align:left;padding:11px 16px;display:flex;flex-direction:column;gap:2px;transition:background .12s;}
.ss-item:last-child{border-right:none;}
.ss-item:hover{background:var(--brand-bg20);}
.ss-item .ss-k{font-size:11.5px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:5px;}
.ss-item .ss-v{font-size:21px;font-weight:700;color:var(--text);letter-spacing:-.5px;}
.ss-item .ss-v em{font-style:normal;font-size:12px;font-weight:500;color:var(--text-3);margin-left:2px;}
.ss-item.on{background:var(--brand-bg30);box-shadow:inset 0 -3px 0 var(--brand);}
.ss-item.on .ss-k{color:var(--brand-strong);font-weight:700;}
.ss-item.on .ss-v{color:var(--brand-strong);}
.ss-item.warn .ss-v{color:var(--p1);}
.ss-item.warn.on{background:var(--p1-bg);box-shadow:inset 0 -3px 0 var(--p1);}
.ss-item.warn.on .ss-k,.ss-item.warn.on .ss-v{color:var(--p1);}
.ss-item.ghost .ss-v{color:var(--text-3);}
.ss-item.ghost.on{background:var(--p2-bg);box-shadow:inset 0 -3px 0 var(--text-3);}
.ss-item.ghost.on .ss-k,.ss-item.ghost.on .ss-v{color:var(--text-2);}

/* 확인필요 패널 (승계) */
.ask-panel{position:fixed;top:0;right:0;bottom:0;width:480px;background:#fff;border-left:1px solid var(--border);box-shadow:-8px 0 28px rgba(0,0,0,.14);z-index:130;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;}
.ask-panel.show{transform:none;}
.drawer-h{padding:15px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.drawer-h h3{font-size:15px;}
.drawer-b{padding:16px 18px;overflow-y:auto;flex:1;}
.ask-row{border-left:3px solid var(--ask);background:var(--surface-2);border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:8px;font-size:12px;}
.ask-row.tbd{border-left-color:var(--tbd);}
.ask-row.gate{border-left-color:var(--p0);background:var(--p0-bg);}
.ask-row .ar-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;}
.ask-row .ar-when{font-size:10.5px;color:var(--text-3);font-weight:700;white-space:nowrap;}
.ask-row .ar-who{font-size:10.5px;color:var(--text-3);}
.ask-sec{font-size:11.5px;font-weight:700;margin:16px 0 8px;}

/* 토스트 (승계) */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:#242c36;color:#fff;padding:10px 18px;border-radius:10px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:620px;}
.toast b{color:#7ecfe0;}

/* 범례 · 콜아웃 (승계) */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-3);padding:9px 13px;background:#fff;border:1px solid var(--border);border-radius:9px;margin-bottom:14px;align-items:center;}
.note{background:var(--brand-bg20);border:1px solid #cfe4ea;border-radius:var(--r-lg);padding:10px 14px;font-size:12px;color:var(--brand-strong);margin-bottom:14px;}
.note.warn{background:var(--tbd-bg);border-color:var(--tbd-border);color:#8a5a1a;}
.note.bad{background:var(--p0-bg);border-color:#f0cdc7;color:#8a3025;}
.chip{border:1px solid var(--border);background:#fff;color:var(--text-2);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:500;}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

/* 매칭 카드 (승계) */
.matchcard{display:block;width:100%;text-align:left;border:1px solid var(--border-strong);background:#fff;border-radius:var(--r-lg);padding:10px 13px;margin-bottom:7px;}
.matchcard.lead{border-color:var(--brand);border-width:1.5px;background:var(--brand-bg20);}
.mc-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
.mc-name{font-size:13.5px;font-weight:700;color:var(--text);}
.mc-line{font-size:11.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.mc-line .ic{color:var(--text-3);}
.mc-src{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;}
.mc-src .sk{color:var(--text-3);font-weight:600;}

/* 접이식 (승계) */
.fold{border:1px solid var(--border);border-radius:var(--r-lg);background:#fff;box-shadow:var(--shadow);margin-bottom:0;}
.fold>summary{list-style:none;cursor:pointer;padding:10px 13px;font-size:12px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px;}
.fold>summary::-webkit-details-marker{display:none;}
.fold>summary::before{content:'▸';color:var(--text-3);font-size:11px;}
.fold[open]>summary::before{content:'▾';}
.fold>summary:hover{color:var(--brand);}
.fold .fold-b{padding:0 13px 13px;border-top:1px solid var(--border);padding-top:11px;}
pre.raw{margin:0;background:#1c2430;color:#d7e3ea;border-radius:var(--r);padding:12px 14px;font-size:11.5px;line-height:1.6;overflow:auto;max-height:300px;
  font-family:'IBM Plex Mono',ui-monospace,'Courier New',monospace;}
pre.raw .kx{color:#7ecfe0;}
pre.raw .nl{color:#e8a97e;font-style:italic;}

/* 상세 펼침 내부 */
.det-b{padding:14px 16px;border-left:3px solid var(--brand);}
.det-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;margin-bottom:14px;}
.det-col h4{font-size:11.5px;color:var(--text-2);margin-bottom:7px;font-weight:700;}
.kv{display:flex;gap:6px;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border);}
.kv .k{color:var(--text-3);min-width:74px;flex:0 0 auto;}
.kv .v{color:var(--text);word-break:break-all;}
.kv:last-child{border-bottom:none;}
.foot-note{margin-top:18px;padding:12px 14px;border:1px dashed var(--border-strong);border-radius:var(--r-lg);background:var(--surface-2);font-size:11.5px;color:var(--text-3);}
.foot-note b{color:var(--text-2);}
.foot-note ul{margin:7px 0 0;padding-left:17px;}
.foot-note li{margin-bottom:4px;}
.mask{position:fixed;inset:0;background:rgba(16,22,30,.3);z-index:120;display:none;}
.mask.show{display:block;}
</style>
</head>
<body>

<div class="mockbar">
  <div class="mb-title">CRM 상담사별 통화목록 목업 <small>v0.1 · 2026-09-15 · 의사결정용</small></div>
  <div class="sp"></div>
  <div class="mb-grp">
    <span class="lb">로그인 사용자</span>
    <div class="scene-tabs" id="userTabs"></div>
  </div>
  <button class="mb-btn" onclick="toggleAsk()">확인 필요<span class="cnt" id="askCnt">0</span></button>
  <button class="mb-btn" onclick="resetAll()">↻ 리셋</button>
</div>

<div class="mb-row2">
  <div class="mb-grp">
    <span class="lb">배치</span>
    <div class="scene-tabs" id="placeTabs"></div>
  </div>
  <div class="mb-grp">
    <span class="lb">단지 매칭 표시</span>
    <div class="scene-tabs" id="matchTabs"></div>
  </div>
  <div class="mb-grp">
    <span class="lb">짧은 통화 기준</span>
    <div class="scene-tabs" id="shortTabs"></div>
    <span class="mb-tbd">미확정</span>
  </div>
</div>

<div class="app">
  <nav class="lnb" id="lnb"></nav>
  <main class="main" id="mainHost"></main>
</div>

<div class="mask" id="mask" onclick="toggleAsk()"></div>
<div class="ask-panel" id="askPanel">
  <div class="drawer-h">
    <h3>확인 필요 · 대상별 <small style="font-weight:400;font-size:11px;color:var(--text-3)">PRD v0.1 §9</small></h3>
    <button class="btn ghost" onclick="toggleAsk()">✕</button>
  </div>
  <div class="drawer-b" id="askBody"></div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

function kstToday(){const n=new Date(),k=new Date(n.getTime()+9*3600e3);return [k.getUTCFullYear(),k.getUTCMonth(),k.getUTCDate()];}

function buildRaw(){
  return SEED.map((r,i)=>{
    const [who,off,hms,ct,remote,conn,endOff,dur,tr,av,cy] = r;
    const [h,mi,s] = hms.split(':').map(Number);
    const st = ep(off,h,mi,s);
    return {
      idx:String(180900+i),
      call_start_time:String(st),
      call_connect_time: conn===null ? null : String(st+conn),
      call_end_time:String(st+endOff),
      call_type:ct,
      av_type:av,
      local_device_id:USERS[who].dev,
      remote_device_id:remote,

      uui:uuid(i),
      _who:who,   /* 목업 전용 — 원본 JSON에는 표시하지 않음 */
    };

}

/* =========================================================================
   3. 파생 계산 — 원본(문자열)을 형변환해서 화면 모델로
   ========================================================================= */
const CT_MAP = {O:'발신', I:'수신'};

function normPhone(v){return String(v==null?'':v).replace(/\D/g,'');}
function fmtPhone(v){
  const d = normPhone(v);
  if(!d) return null;                                   /* 번호 없음 */
  if(/^070\d{8}$/.test(d)||/^01\d{9}$/.test(d)) return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  if(/^02\d{8}$/.test(d)) return '02-'+d.slice(2,6)+'-'+d.slice(6);
  if(/^0\d{9,10}$/.test(d)) return d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4);
  if(/^1\d{7}$/.test(d)) return d.slice(0,4)+'-'+d.slice(4);   /* 대표번호 */
  return d;                                             /* 해석 불가 — 원본 그대로 */
}
function fmtKST(sec){
  if(sec===null||sec===undefined||sec==='') return null;
  const d = new Date(Number(sec)*1000 + 9*3600e3), p=n=>String(n).padStart(2,'0');
  return p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());
}
function fmtDur(ms){
  const n = Number(ms);
  if(!isFinite(n)||n<=0) return '-';
  const sec = n/1000;
  if(sec < 60) return (Number.isInteger(sec)?sec:sec.toFixed(1))+'초';
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m+'분 '+(s?s+'초':'0초');
}

/* 단지 후보 — created_at 내림차순 (현행 규칙: 최신 1건 우선) */
function candidates(remote){
  const key = normPhone(remote);
  const arr = (MAP[key]||[]).slice();
  arr.sort((a,b)=> a.created_at < b.created_at ? 1 : -1);
  return arr;
}

function derive(r){
  const st = Number(r.call_start_time);
  const cn = r.call_connect_time===null ? null : Number(r.call_connect_time);
  const en = Number(r.call_end_time);
  const durMs = Number(r.call_duration||0);
  const durSec = durMs/1000;

  const connected = cn !== null;
  const isShort = connected && durSec <= S.shortSec;
  const isDead = !connected || isShort;
  const transferred = !!r.transferred_device_id;

  let status;
  if(transferred)       status = {k:'TR',  t:'호전환',   c:'st-tr'};
  else if(!connected)   status = {k:'NC',  t:'미연결',   c:'st-nc'};
  else if(isShort)      status = {k:'SH',  t:'바로 끊김', c:'st-dead'};
  else                  status = {k:'OK',  t:'연결',     c:'st-ok'};

  const cands = candidates(r.remote_device_id);
  const phone = fmtPhone(r.remote_device_id);

  /* 결측·논리모순 플래그 */
  const anom = [];
  if(connected && cn === st && durMs === 0) anom.push('시작=연결인데 통화 0초');
  if(en < st) anom.push('종료<시작');
  if(!CT_MAP[r.call_type]) anom.push('call_type 해석 불가');
  if(!phone) anom.push('번호 없음');

  return {
    raw:r, who:r._who, st, cn, en, durMs, durSec,
    connected, isShort, isDead, transferred, status,
    dirCode:r.call_type, dirLabel:CT_MAP[r.call_type]||null,
    phone, phoneDigits:normPhone(r.remote_device_id),
    cands, matched:cands.length>0, multi:cands.length>1,
    video:r.av_type==='1', anom,
  };
}

/* =========================================================================
   4. 필터링
   ========================================================================= */
function dayOffsetOf(sec){
  const [y,m,d] = kstToday();
  const todayStart = Math.floor(Date.UTC(y,m,d,-9,0,0)/1000);
  return Math.floor((sec - todayStart)/86400);
}
function inPeriod(off){
  if(S.period==='today') return off===0;
  if(S.period==='yday')  return off===-1;
  return off<=0 && off>=-6;                      /* 최근 7일 (오늘 포함) */
}
/* 기간 + 로그인 사용자(관리자는 상담사 선택)까지만 적용한 기준 집합 — 요약 스트립의 모수 */
function baseRows(){
  return RAW.map(derive).filter(d=>{
    if(!inPeriod(dayOffsetOf(d.st))) return false;
    if(S.user==='M') return S.agentSel==='ALL' ? true : d.who===S.agentSel;
    return d.who===S.user;
  });
}
function applyFilters(rows){
  const q = normPhone(S.q);
  return rows.filter(d=>{
    if(S.dir!=='ALL' && d.dirCode!==S.dir) return false;
    if(S.conn==='OK'   && d.isDead) return false;
    if(S.conn==='DEAD' && !d.isDead) return false;
    if(S.mch==='MATCHED' && !d.matched) return false;
    if(S.mch==='MULTI'   && !d.multi)   return false;
    if(S.mch==='NONE'    && d.matched)  return false;
    if(q && !d.phoneDigits.includes(q)) return false;   /* 하이픈 무관 검색 */
    return true;
  });
}
function sortRows(rows){
  const k=S.sortKey, dir=S.sortDir==='asc'?1:-1;
  return rows.slice().sort((a,b)=>{
    const va = k==='dur' ? a.durMs : a.st;
    const vb = k==='dur' ? b.durMs : b.st;
    if(va===vb) return (a.st-b.st)*dir;
    return (va-vb)*dir;
  });
}

  S.open={};render();
}

function renderNav(){
  const top = S.place==='A' ? 'dash' : 'counsel';
  const sub = S.place==='A' ? null   : 'mycall';
  let h = '<div class="logo">APTNERS CRM</div>';
  NAV.forEach(n=>{

      n.sub.forEach(s=>{
        if(s.neo && S.place!=='B') return;            /* B안에서만 신설 메뉴가 존재 */
        h += `<button class="lnb-sub ${s.k===sub?'active':''}" onclick="navClick()">· ${esc(s.t)}${s.neo?' '+bdg('b-new','신규'):''}</button>`;
      });
    }
    if(n.k==='callback'||n.k==='perf') h += '<div class="lnb-div"></div>';
  });
  document.getElementById('lnb').innerHTML = h;
}

function summaryStrip(base){
  const cO = base.filter(d=>d.dirCode==='O').length;
  const cI = base.filter(d=>d.dirCode==='I').length;
  const cD = base.filter(d=>d.isDead).length;
  const cN = base.filter(d=>!d.matched).length;
  const item = (cls,on,k,v,kind,extra) =>
    `<button class="ss-item ${cls} ${on?'on':''}" onclick="ssClick('${kind}')">
       <span class="ss-k">${k}${extra||''}</span>
       <span class="ss-v">${v}<em>건</em></span>
     </button>`;
  return `<div class="summary-strip">
    ${item('', S.dir==='O','발신',cO,'O')}
    ${item('', S.dir==='I','수신',cI,'I')}
    ${item('warn', S.conn==='DEAD','바로 끊김 · 미연결',cD,'DEAD',
        ` <span class="bdg b-tbd">${S.shortSec}초 기준</span>`)}
    ${item('ghost', S.mch==='NONE','미등록 번호',cN,'NONE')}
  </div>`;
}

function aptCell(d){
  if(!d.matched) return `<span class="bdg b-unk">미등록 번호</span>`;
  const lead = d.cands[0];
  if(S.match==='A') return `<b>${esc(lead.apt)}</b>`;
  return `<b>${esc(lead.apt)}</b>` + (d.cands.length>1 ? ' '+bdg('b-more','외 '+(d.cands.length-1)+'곳') : '');
}
function dirCell(d){
  if(!d.dirLabel) return `<span class="bdg b-unk">알 수 없음(${esc(d.dirCode)})</span>`;
  return d.dirCode==='O' ? bdg('b-out','발신') : bdg('b-in','수신');
}
function anomMark(d){
  if(!d.anom.length) return '';
  return `<span class="anom" title="${esc(d.anom.join(' · '))}">⚠ ${esc(d.anom[0])}${d.anom.length>1?' 외 '+(d.anom.length-1):''}</span>`;
}
function rawJson(r){
  const o = {};
  ['idx','call_start_time','call_connect_time','call_end_time','call_type','av_type',
   'local_device_id','remote_device_id','transferred_device_id','call_duration',
   'CallerName','TransferringName','counsel_yn','uui'].forEach(k=>o[k]=r[k]);
  const lines = Object.keys(o).map(k=>{
    const v = o[k];
    const vv = v===null ? '<span class="nl">null</span>' : '"'+esc(v)+'"';
    return `  <span class="kx">"${k}"</span>: ${vv}`;
  });
  return `<pre class="raw">{\n${lines.join(',\n')}\n}</pre>`;
}
function detailRow(d,i,cols){
  const r = d.raw;
  const startS = fmtKST(d.st), connS = d.cn===null?null:fmtKST(d.cn), endS = fmtKST(d.en);
  const kv=(k,v,warn)=>`<div class="kv"><span class="k">${k}</span><span class="v ${warn?'':''}">${v}</span></div>`;

  const cands = d.cands.length
    ? d.cands.map((c,ci)=>`<div class="matchcard ${ci===0?'lead':''}">
        <div class="mc-top">

        <div class="mc-line"><span class="ic">🕘</span> created_at <span class="mono">${esc(c.created_at)}</span>${c.memo?' · '+esc(c.memo):''}</div>

       <div class="mc-src"><span class="sk">매핑 출처</span> 해당 없음 ${tbd('미확정')}</div></div>`;

  return `<tr class="det"><td colspan="${cols}"><div class="det-b">
    <div class="det-grid">

      <details class="fold"><summary>원본 데이터 보기 <span class="muted" style="font-weight:400">CTI 원본 · N/A 필드 포함 · 모든 값 문자열</span></summary>

function tableCard(rows){
  const cols = 8;
  const sar = k => S.sortKey===k ? `<span class="sar">${S.sortDir==='asc'?'▲':'▼'}</span>` : '';
  const head = `<thead><tr>
      <th style="width:30px"></th>
      <th style="width:78px">방향</th>
      <th class="sortable" style="width:130px" onclick="sortBy('start')">통화 시작${sar('start')}</th>
      <th style="width:130px">상대방 번호</th>
      <th>단지명</th>
      <th class="sortable" style="width:110px" onclick="sortBy('dur')">통화시간${sar('dur')}</th>
      <th style="width:110px">상태</th>
      <th style="width:64px">영상</th>
    </tr></thead>`;

  const body = rows.length
    ? rows.map(d=>{
        const i = d.raw.idx, open = !!S.open[i];
        return `<tr class="pick ${d.isDead?'row-dead':''} ${open?'open':''}" onclick="toggleRow('${i}')">
            <td><span class="exp">${open?'▾':'▸'}</span></td>
            <td>${dirCell(d)}</td>
            <td class="mono">${esc(fmtKST(d.st))}</td>
            <td class="mono">${d.phone?esc(d.phone):'<span class="bdg b-unk">번호 없음</span>'}</td>
            <td>${aptCell(d)}${anomMark(d)}</td>
            <td>${fmtDur(d.durMs)}</td>
            <td><span class="st ${d.status.c}">${d.status.t}</span></td>
            <td>${d.video?bdg('b-vid','영상'):''}</td>
          </tr>` + (open ? detailRow(d,i,cols) : '');
      }).join('')
    : `<tr><td colspan="${cols}"><div class="empty-st">조건에 맞는 통화가 없습니다</div></td></tr>`;

  return `<div class="card" style="padding:0;overflow:hidden">
    <div class="card-h">
      <h3>통화목록 <span class="muted" style="font-weight:400;font-size:12px">${rows.length}건</span></h3>
      <span class="muted" style="font-size:11px">행을 클릭하면 상세가 펼쳐집니다 · 통화 시작 · 통화시간 컬럼 클릭 정렬</span>
    </div>
    <div class="tbl-wrap" style="border:none;border-radius:0">
      <table class="data">${head}<tbody>${body}</tbody></table>
    </div>
  </div>`;
}

    `<div class="ask-sec" style="color:var(--ask)">운영(요청자) ${ASK_OPS.length}건</div>`+
    ASK_OPS.map(a=>askRow(a)).join('')+
    `<div class="ask-sec" style="color:var(--ask)">프로덕트 — 내부 판단 ${ASK_PROD.length}건</div>`+
    ASK_PROD.map(a=>askRow(a)).join('')+
    `<div class="ask-sec" style="color:var(--text-2)">이번 목업 스콥 밖 ${SCOPE_OUT.length}건</div>`+
    SCOPE_OUT.map(s=>`<div class="ask-row" style="border-left-color:var(--border-strong)">
       <div class="ar-who" style="font-size:11.5px;color:var(--text-2)">${esc(s)}</div></div>`).join('');
}

/* =========================================================================
   12. 페이지 렌더
   ========================================================================= */
function legend(){
  return `<div class="legend">
    <span style="font-weight:700;color:var(--p0)">목업 — 실제 데이터가 아닙니다</span>
    <span>${bdg('b-out','발신')} / ${bdg('b-in','수신')}</span>
    <span><span class="st st-ok">연결</span> <span class="st st-dead">바로 끊김</span> <span class="st st-nc">미연결</span> <span class="st st-tr">호전환</span></span>
    <span>${bdg('b-more','외 N곳')} 복수 후보</span>
    <span>${bdg('b-unk','미등록 번호')}</span>
    <span>${tbd('미확정')} ${askb('확인 필요')}</span>
    <span style="border-left:1px solid var(--border);padding-left:14px">상담사·단지명·전화번호는 전부 가공 데이터</span>
  </div>`;
}

function pageHeader(base){
  const who = S.user==='M'
    ? (S.agentSel==='ALL' ? '전체 상담사' : USERS[S.agentSel].label)
    : USERS[S.user].label;
  const title = S.place==='A' ? '내 통화' : '내 통화기록';

  const agentPicker = S.user==='M'
    ? `<div class="fld" style="min-width:230px">
         <label>상담사 선택 ${tbd('미확정')}</label>
         <select class="ctl" onchange="setAgent(this.value)">
           <option value="ALL" ${S.agentSel==='ALL'?'selected':''}>전체 상담사</option>
           <option value="A" ${S.agentSel==='A'?'selected':''}>상담사A (L3)</option>
           <option value="B" ${S.agentSel==='B'?'selected':''}>상담사B (L3)</option>
         </select>
         <div class="hint">관리자(L2)가 다른 상담사 통화기록을 열람해도 되는지 아직 정해지지 않았습니다</div>
       </div>`
    : '';

  return `<div class="page-h">
      <h2>${esc(title)} <span class="muted" style="font-size:13px;font-weight:400">· ${esc(who)}</span></h2>
      ${agentPicker}
    </div>`;
}

function topNotes(){
  let h = `<div class="note">이 화면의 1차 목적은 "내 통화 전체 보기"가 아니라
    <b>짧게 끊기거나 연결되지 않은 통화의 상대가 누구(어느 단지)인지 바로 알아보는 것</b>입니다.
    요약 스트립의 <b>바로 끊김 · 미연결</b>이 이 화면의 주인공입니다.</div>`;
  if(S.place==='A'){
    h += `<div class="note warn"><b>배치 A안 — 대시보드 내 "내 통화" 영역</b> ·
      CRM 개편 원칙상 대시보드는 <b>권한 무관 전체 풀노출</b>인데, 이 화면은 로그인 사용자 기준으로 걸러집니다.
      원칙과 충돌하는 배치입니다. ${askb('프로덕트 판단')}</div>`;
  } else {
    h += `<div class="note warn"><b>배치 B안 — 통합 상담 › 내 통화기록 메뉴 신설</b> ${bdg('b-new','신규')} ·
      권한별 차등이 걸리는 기존 메뉴 쪽이라 "개인 기준으로 걸러진다"는 성격과 맞습니다.
      대신 <b>메뉴가 하나 늘어납니다</b> — CRM IA 확정 전이라 신설 여부는 미확정입니다. ${tbd('IA 미확정')}</div>`;
  }
  return h;
}

function bottomNotes(){
  let h = '';
  if(S.match==='A'){
    h += `<div class="note bad" style="margin-top:14px"><b>현행 규칙(A안 · created_at 최신 1건)은
      소장님 단지 이동 시 이전 단지가 뜨는 오매칭 민원이 이미 있는 방식입니다.</b>
      샘플의 <span class="mono">010-0000-1234</span> 번호를 보세요 — 현재 근무 단지는 <b>한빛마을 1단지</b>인데,
      나중에 생성된 매핑 때문에 A안에서는 <b>솔숲마을 3단지</b>(이전 근무 단지)가 표시됩니다.
      B안으로 바꾸면 두 곳이 모두 보입니다.</div>`;
  } else {
    h += `<div class="note" style="margin-top:14px"><b>B안 · 후보 전부</b> — 대표 1건 + <b>외 N곳</b> 배지로 복수 매핑을 드러냅니다.
      행을 펼치면 후보 전체와 <b>매핑 출처</b>를 볼 수 있습니다. 대신 상담사가 <b>한 번 더 판단</b>해야 합니다 —
      전화가 울리는 중이 아니라 통화가 끝난 뒤 보는 화면이므로 이쪽이 감당 가능한지 운영 확인이 필요합니다. ${askb('운영 확인')}</div>`;
  }
  h += `<div class="foot-note">
    <b>이 화면에서 임의로 판단한 것 — 회의에서 뒤집힐 수 있습니다</b>
    <ul>
      <li>${askb('확인 필요')} <b>call_duration을 밀리초로 가정</b>했습니다. 원본 샘플이 시작~종료 3초에 값 <span class="mono">3204</span>였기 때문입니다.
        초 단위라면 화면의 모든 통화시간이 1000배가 되고 "바로 끊김" 판정이 전부 뒤집힙니다.</li>
      <li>${askb('확인 필요')} <b>call_type은 O=발신 / I=수신으로 가정</b>했고, 그 외 값은 <span class="bdg b-unk">알 수 없음(원본값)</span>으로 표시합니다.
        코드표 전체를 받기 전까지는 이 두 개만 해석합니다. 그래서 <b>요약 스트립의 발신 + 수신 합이 목록 총 건수보다 적을 수 있습니다</b> —
        해석 못 한 코드가 어느 쪽에도 안 들어가기 때문입니다. 이 차이가 곧 코드표를 받아야 하는 이유입니다.</li>
      <li>${askb('확인 필요')} <b>미연결 판정은 call_connect_time이 null인 경우</b>로 잡았습니다.
        샘플에는 <b>시작=연결인데 통화 0초</b>인 행이 있어(<span class="mono">10:48:15</span>) 이 기준이 성립하지 않을 수 있습니다 — 그 행에 ⚠ 표시가 붙어 있습니다.</li>
      <li>${tbd('미확정')} <b>호전환 통화를 누구의 기록으로 볼지</b> 정해지지 않아, 목업에서는 <b>돌린 사람(local_device_id)</b> 기준으로 남겼습니다.
        단지 매칭도 <span class="mono">remote_device_id</span> 기준입니다.</li>
      <li>${tbd('미확정')} <b>관리자(L2)의 타 상담사 열람 허용 여부</b>가 미정이라, 드롭다운은 뜨지만 배지를 달아 두었습니다.</li>
      <li>권한별 <b>전화번호 마스킹은 구현하지 않았습니다</b> — 이번 스콥 밖이며 확인 필요 패널에만 기재했습니다.</li>
    </ul>
  </div>`;
  return h;
}

function render(){
  renderToolbar();
  renderNav();
  const base = baseRows();
  const rows = sortRows(applyFilters(base));
  document.getElementById('mainHost').innerHTML =
    `<div class="crumb">${crumbHtml()}</div>` +
    legend() +
    pageHeader(base) +
    topNotes() +
    summaryStrip(base) +
    filterCard() +
    tableCard(rows) +
    bottomNotes();
  if(FOCUS){
    const el = document.getElementById(FOCUS);
    if(el){el.focus(); if(el.setSelectionRange) el.setSelectionRange(el.value.length,el.value.length);}
    FOCUS = null;
  }
}

renderAsk();
render();
</script>
</body>
</html>
